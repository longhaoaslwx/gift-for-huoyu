name: 每日更新动态数据

# 北京时间每天 0:30 = UTC 前一天 16:30
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:      # 也允许手动触发，方便随时补一次
    inputs:
      refresh_stats:
        description: '全量重抓详情刷新历史互动数据（约1.5小时，默认关闭；日常增量更新不用勾）'
        type: boolean
        default: false

permissions:
  contents: write         # 要把更新后的数据提交回仓库

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 全量基线数据（dynamics/all.json + raw/detail_cache.json）已随仓库提交，
      # runner 无需重抓历史：列表接口对境外 IP 只放行近期约 600 条，历史部分
      # 由基线 + build 阶段的存量合并保住，这里每天只抓新增的几个条目。
      # 注意：不要再用 actions/cache 缓存 data/bilibili——旧缓存会把境外
      # IP 抓到的 600 条版本盖回已提交的 2165 条基线，造成数据丢失。
      # 日常跑：只抓增量 + 用列表接口刷新近期约 600 条的点赞（零额外请求）；
      # 手动勾选 refresh_stats：额外重抓全部详情，把历史条目的点赞/评论/
      # 转发也刷成当前值（约 1.5 小时，见 monthly-refresh.yml 的自动版）。
      - name: 拉取最新动态
        run: |
          if [ "${{ github.event.inputs.refresh_stats }}" = "true" ]; then
            echo "== 全量刷新模式：重抓全部详情 =="
            python bili_dynamic_crawler.py --refresh-stats --pace 2.0 --no-web-check
          else
            python bili_dynamic_crawler.py --pace 1.2 --no-web-check
          fi

      # translate_dynamics.py 天然跳过已有译文，只会补新增的几条；
      # sync_translations.py 在全刷后找出正文有变化的老条目定向重译
      # （日常增量模式下零变化、零请求）；apply_fixes.py 再把人工确认过
      # 的译文盖回去（防机翻冲掉人工真值）。
      - name: 补齐新增译文并回写人工修正
        run: |
          python translate_dynamics.py
          python sync_translations.py
          python apply_fixes.py

      # 新增动态的配图/视频封面（只补缺失的文件，已存在的跳过；
      # 单个图片失败不影响整体，退出码恒为 0）
      - name: 抓取新增图片
        run: |
          python fetch_media_thumbs.py
          python fetch_covers.py

      - name: 重建站点数据
        run: python build_site_data.py

      - name: 同步 AI 翻译标注统计
        run: python mark_ai_translations.py

      - name: 提交变更
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/assets/data site/assets/images/media translation/ja2zh.json translation/ai_notice.json \
                    data/bilibili/2094031249/dynamics/all.json data/bilibili/2094031249/raw/detail_cache.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
