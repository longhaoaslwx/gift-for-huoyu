name: 每日更新动态数据

# 北京时间每天 0:30 = UTC 前一天 16:30
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:      # 也允许手动触发，方便随时补一次

permissions:
  contents: write         # 要把更新后的数据提交回仓库

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 原始抓取数据（清单/详情缓存 + 媒体）不进仓库，用 Actions 缓存跨天保留：
      # 有了它每天只抓新增的几条，没它就整库重抓一次（约 40~55 分钟）。
      - name: 恢复抓取缓存
        uses: actions/cache@v4
        with:
          path: data/bilibili
          key: bili-data-${{ github.run_id }}
          restore-keys: |
            bili-data-

      - name: 拉取最新动态
        run: python bili_dynamic_crawler.py --pace 1.2

      # translate_dynamics.py 天然跳过已有译文，只会补新增的几条；
      # apply_fixes.py 再把人工确认过的译文盖回去（防机翻冲掉人工真值）。
      - name: 补齐新增译文并回写人工修正
        run: |
          python translate_dynamics.py
          python apply_fixes.py

      - name: 重建站点数据
        run: python build_site_data.py

      - name: 同步 AI 翻译标注统计
        run: python mark_ai_translations.py

      - name: 提交变更
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/assets/data site/assets/images/media translation/ja2zh.json translation/ai_notice.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
